# Blueprint de deploy no Render (opcional).
# Valores marcados com "sync: false" você preenche no painel do Render.
databases:
  - name: nimbus-bank-db
    databaseName: bank_system
    plan: free

services:
  # ---- API (Spring Boot, via Dockerfile) ----
  - type: web
    runtime: docker
    name: nimbus-bank-api
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # JDBC do banco: jdbc:postgresql://HOST:PORTA/bank_system (pegue na página do DB)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        fromDatabase:
          name: nimbus-bank-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nimbus-bank-db
          property: password
      # Chave Base64 (>= 256 bits). Gere com: openssl rand -base64 48
      - key: JWT_SECRET
        sync: false
      # URL pública do frontend (ex.: https://nimbus-bank-web.onrender.com)
      - key: ALLOWED_ORIGINS
        sync: false

  # ---- Frontend (React/Vite, site estático) ----
  - type: web
    runtime: static
    name: nimbus-bank-web
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # URL pública da API (ex.: https://nimbus-bank-api.onrender.com)
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
