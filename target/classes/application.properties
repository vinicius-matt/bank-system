spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bank_system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
server.port=8080
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
springdoc.swagger-ui.defaultModelsExpandDepth=-1

# ===== JWT / Security =====
# Chave secreta em Base64 (>= 256 bits). TROQUE em produção e use a variável de ambiente JWT_SECRET.
app.jwt.secret=${JWT_SECRET:c2VjcmV0LWtleS1iYW5rLXN5c3RlbS1jaGFuZ2UtdGhpcy1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
# Access token: curto (15 min) em milissegundos
app.jwt.expiration=${JWT_EXPIRATION:900000}
# Refresh token: longo (7 dias) em milissegundos
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
