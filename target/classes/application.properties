spring.datasource.url=jdbc:postgresql://localhost:5432/bank_system
spring.datasource.username=postgres
spring.datasource.password=root
server.port=8080
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
springdoc.swagger-ui.defaultModelsExpandDepth=-1
# ===== JWT / Security =====
# Chave secreta em Base64 (>= 256 bits). TROQUE em produção e use variável de ambiente.
app.jwt.secret=${JWT_SECRET:c2VjcmV0LWtleS1iYW5rLXN5c3RlbS1jaGFuZ2UtdGhpcy1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
# Expiração do token em milissegundos (24h)
app.jwt.expiration=86400000
